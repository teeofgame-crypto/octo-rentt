    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,500&family=Noto+Serif+Thai:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ================= DESIGN TOKENS =================
           Concept: "The Lookbook" — an editorial fashion catalog, not a
           soft SaaS card grid. Sharp corners, hairline rules, a dark
           espresso masthead band, and a signature interaction: every
           photo sits in quiet desaturated tone until you hover, when
           colour rushes back in — the way flipping to a page brings a
           look to life.

           Color
             --ink        #201510  espresso — masthead band, primary text
             --cream      #F6F0E4  page ground
             --paper      #FFFCF5  raised paper surface (modal, inputs)
             --tan        #D8C6A6  hairline rule / border
             --clay       #8B5E3C  mid brown — labels, icons, numerals
             --thread     #C1786C  the single accent thread — active
                                    underline + saved heart, nowhere else

           Type
             Bodoni Moda        — display serif for the Latin wordmark
                                   and every English product/brand name
                                   (the fashion-editorial workhorse)
             Noto Serif Thai    — Thai headlines, same dramatic register
             IBM Plex Sans Thai — Thai running copy + Archivo for
                                   tracked Latin labels/UI text

           Layout
             Masthead: asymmetric two-column band (headline / stat rail)
             Nav: text tabs with a thread underline, not pill buttons
             Catalog: CSS-column masonry, varied aspect ratios, sharp
             corners, no shadows — a printed lookbook, not app cards
        =================================================== */
        :root {
            --ink: #2B2016;
            --cream: #FBF7EF;
            --cream-deep: #F0E6D3;
            --paper: #FFFEFA;
            --tan: #E6DBC4;
            --clay: #9C7A54;
            --thread: #C1786C;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'IBM Plex Sans Thai', sans-serif;
            background-color: var(--cream);
            color: var(--ink);
            margin: 0;
        }

        .serif-en   { font-family: 'Bodoni Moda', serif; }
        .serif-th   { font-family: 'Noto Serif Thai', serif; }
        .label-en   { font-family: 'Archivo', sans-serif; letter-spacing: 1.6px; text-transform: uppercase; }

        /* ---------- NAV ---------- */
        .topnav {
            background-color: var(--cream);
            border-bottom: 1px solid var(--tan);
            padding: 20px 0;
        }

        .brand-mark {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: 1px;
            color: var(--ink);
        }

        .brand-mark span { color: var(--clay); }

        .saved-link {
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--ink);
        }

        .saved-link .label-en { font-size: 0.72rem; color: var(--clay); }

        #favCount {
            font-family: 'Archivo', sans-serif;
            background: none !important;
            color: var(--ink) !important;
            font-size: 0.95rem;
            font-weight: 500;
            position: static !important;
            transform: none !important;
            padding: 0 !important;
        }

        /* ---------- MASTHEAD ---------- */
        .masthead {
            background-color: var(--cream-deep);
            color: var(--ink);
            padding: 72px 0 46px;
        }

        .masthead .eyebrow {
            font-size: 0.72rem;
            color: var(--clay);
            margin-bottom: 18px;
            display: block;
        }

        .masthead h1 {
            font-family: 'Playfair Display', 'Noto Serif Thai', serif;
            font-weight: 700;
            font-size: 3.1rem;
            line-height: 1.2;
            margin: 0 0 20px;
            color: var(--ink);
        }

        .masthead .sub {
            color: #7C6A57;
            font-weight: 400;
            font-size: 1.02rem;
            max-width: 380px;
            line-height: 1.7;
        }

        .stat-rail {
            border-left: 1px solid rgba(43, 32, 22, 0.16);
            padding-left: 26px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 20px;
        }

        .stat-rail .stat-num {
            font-family: 'Bodoni Moda', serif;
            font-size: 2.1rem;
            color: var(--ink);
            line-height: 1;
        }

        .stat-rail .stat-label {
            font-size: 0.68rem;
            color: var(--clay);
            display: block;
            margin-top: 4px;
        }

        /* ---------- BRAND TABS ---------- */
        .tabs-wrap {
            background-color: var(--cream);
            border-bottom: 1px solid var(--tan);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        #brandTabs {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 28px;
            list-style: none;
            padding: 18px 4px;
            margin: 0;
            scrollbar-width: none;
        }

        #brandTabs::-webkit-scrollbar { display: none; }

        .brand-tab {
            background: none;
            border: none;
            white-space: nowrap;
            font-family: 'Archivo', sans-serif;
            font-size: 0.76rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #A5937A;
            padding: 0 0 8px;
            position: relative;
            transition: color 0.25s ease;
        }

        .brand-tab::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            height: 2px;
            width: 0%;
            background-color: var(--thread);
            transition: width 0.3s ease;
        }

        .brand-tab.active,
        .brand-tab:hover {
            color: var(--ink);
        }

        .brand-tab.active::after {
            width: 100%;
        }

        /* ---------- CATALOG — masonry columns ---------- */
        .catalog {
            column-count: 3;
            column-gap: 28px;
            padding: 42px 0 60px;
        }

        .look-item {
            break-inside: avoid;
            margin-bottom: 34px;
            cursor: pointer;
        }

        .look-frame {
            position: relative;
            overflow: hidden;
            background-color: var(--tan);
        }

        .look-frame img {
            display: block;
            width: 100%;
            height: auto;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .look-item:hover .look-frame img {
            transform: scale(1.045);
        }

        .look-scrim {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 22px 14px 10px;
            background: linear-gradient(to top, rgba(32,21,16,0.72), transparent);
        }

        .look-scrim .brand-label {
            font-family: 'Archivo', sans-serif;
            font-size: 0.66rem;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: var(--tan);
        }

        .look-meta {
            padding: 14px 2px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .look-meta h3 {
            font-size: 1.1rem;
            margin: 0 0 4px;
            color: var(--ink);
        }

        .look-meta .swatch-row {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.78rem;
            color: #8A7563;
        }

        .size-bracket {
            font-family: 'Archivo', sans-serif;
            font-size: 0.72rem;
            color: var(--clay);
            white-space: nowrap;
            padding-top: 2px;
        }

        .fav-toggle {
            border: none;
            background: none;
            padding: 4px 0 0 10px;
            line-height: 1;
        }

        .fav-toggle i.fa-solid { color: var(--thread); }
        .fav-toggle i.fa-regular { color: #B7A489; }

        /* ---------- MODAL ---------- */
        .modal-content {
            border-radius: 0;
            border: 1px solid var(--ink);
            background-color: var(--cream);
        }

        .btn-close-custom {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 1055;
            background: var(--cream);
            border: 1px solid var(--ink);
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .carousel-item img {
            height: 520px;
            width: 100%;
            object-fit: cover;
        }

        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            filter: none;
            background-color: transparent;
            background-image: none;
            position: relative;
        }

        .carousel-control-prev, .carousel-control-next {
            width: 8%;
        }

        .carousel-control-prev i, .carousel-control-next i {
            color: var(--cream);
            font-size: 1.3rem;
            background: rgba(32,21,16,0.55);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #modalBrand {
            font-family: 'Archivo', sans-serif;
            font-size: 0.68rem;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: var(--clay);
            display: block;
            margin-bottom: 10px;
        }

        #modalTitle {
            font-size: 1.9rem;
            color: var(--ink);
            margin-bottom: 14px;
        }

        #modalDesc {
            color: #7C6A57;
            border-top: 1px solid var(--tan);
            padding-top: 14px;
            margin-bottom: 20px !important;
        }

        .modal-body label {
            font-family: 'Archivo', sans-serif;
            font-size: 0.68rem;
            letter-spacing: 1.4px;
            color: var(--clay);
        }

        .size-btn {
            border: 1px solid var(--ink);
            color: var(--ink);
            background: none;
            padding: 5px 16px;
            font-family: 'Archivo', sans-serif;
            font-size: 0.78rem;
        }

        .measure-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        .measure-table td {
            padding: 9px 0;
            border-bottom: 1px solid var(--tan);
            font-size: 0.86rem;
            color: #6B5A48;
        }

        .measure-table td:last-child {
            text-align: right;
            color: var(--ink);
            font-weight: 500;
        }

        @media (max-width: 991px) {
            .catalog { column-count: 2; }
        }

        @media (max-width: 767px) {
            .masthead { padding: 46px 0 34px; }
            .masthead h1 { font-size: 2.1rem; }
            .masthead .sub { font-size: 0.92rem; }
            .stat-rail {
                border-left: none;
                border-top: 1px solid rgba(43, 32, 22, 0.16);
                padding-left: 0;
                padding-top: 18px;
                margin-top: 18px;
                flex-direction: row;
                justify-content: space-between;
            }
            .catalog { column-count: 1; padding: 30px 0 40px; }
            .carousel-item img { height: 380px; }
            .modal-body { padding: 20px !important; }
        }
    </style>
</head>

        ];

        let favorites = [];
        let dressModalInstance = null;

        // gives the masonry its editorial rhythm — alternating frame ratios
        const ratioCycle = ['4 / 5', '3 / 4', '1 / 1', '4 / 5'];

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("statLooks").innerText = dresses.length;
            const brandCount = new Set(dresses.map(d => d.brand)).size;
            document.getElementById("statBrands").innerText = brandCount;
            renderGallery(dresses);
            dressModalInstance = new bootstrap.Modal(document.getElementById("dressModal"));
        });

        function renderGallery(items) {
            const grid = document.getElementById("galleryGrid");
            grid.innerHTML = "";

            items.forEach((item, i) => {
                const isFav = favorites.includes(item.id);
                const ratio = ratioCycle[i % ratioCycle.length];
                const cardHTML = `
                    <div class="look-item" onclick="openModal(${item.id})">
                        <div class="look-frame" style="aspect-ratio: ${ratio};">
                            <img src="${item.coverImage}" alt="${item.name}" onerror="handleImgError(this)" style="height:100%; object-fit:cover;">
                            <div class="look-scrim">
                                <span class="brand-label">${item.brand}</span>
                            </div>
                        </div>
                        <div class="look-meta">
                            <div>
                                <h3 class="serif-en">${item.name}</h3>
                                <div class="swatch-row">
                                    ${item.color.name}
                                </div>
                            </div>
                            <div class="d-flex flex-column align-items-end">
                                <span class="size-bracket">[ ${item.size.name} ]</span>
                                <button class="fav-toggle" onclick="toggleFav(event, ${item.id})" aria-label="เพิ่มรายการโปรด">
                                    <i class="${isFav ? "fa-solid" : "fa-regular"} fa-heart"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML("beforeend", cardHTML);
            });
        }

        function filterBrand(brandName, btnElement) {
            document.querySelectorAll("#brandTabs .brand-tab").forEach(btn => {
                btn.classList.remove("active");
            });

            if (btnElement) {
                btnElement.classList.add("active");
            }

            if (brandName === "all") {
                renderGallery(dresses);
            } else {
                const filtered = dresses.filter(dress => dress.brand === brandName);
                renderGallery(filtered);
            }
        }

        function toggleFav(event, id) {
            event.stopPropagation();
            const index = favorites.indexOf(id);

            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(id);
            }

            document.getElementById("favCount").innerText = favorites.length;

            const activeBtn = document.querySelector("#brandTabs .brand-tab.active");
            if (activeBtn && activeBtn.innerText.trim() !== "all collections") {
                const currentBrand = activeBtn.getAttribute("onclick").match(/'([^']+)'/)[1];
                filterBrand(currentBrand, activeBtn);
            } else {
                renderGallery(dresses);
            }
        }

        function openModal(id) {
            const item = dresses.find(d => d.id === id);
            if (!item) return;

            document.getElementById("modalBrand").innerText = item.brand;
            document.getElementById("modalTitle").innerText = item.name;
            document.getElementById("modalDesc").innerText = item.desc || "ไม่มีรายละเอียดเพิ่มเติมสำหรับรายการนี้";

            const carouselInner = document.getElementById("carouselInner");
            carouselInner.innerHTML = "";

            item.images.forEach((imgUrl, idx) => {
                const carouselItem = `
                    <div class="carousel-item ${idx === 0 ? 'active' : ''}">
                        <img src="${imgUrl}" alt="${item.name}" onerror="handleImgError(this)">
                    </div>
                `;
                carouselInner.insertAdjacentHTML("beforeend", carouselItem);
            });

            const sizeContainer = document.getElementById("modalSizes");
            sizeContainer.innerHTML = `<span class="size-btn">${item.size.name}</span>`;

            const sizeDetailBox = document.getElementById("sizeDetailBox");
            sizeDetailBox.innerHTML = `
                <tr><td>อก (Chest)</td><td>${item.size.chest} นิ้ว</td></tr>
                <tr><td>เอว (Waist)</td><td>${item.size.waist} นิ้ว</td></tr>
                <tr><td>ยาว (Length)</td><td>${item.size.length} นิ้ว</td></tr>
            `;

            dressModalInstance.show();
        }
    </script>
